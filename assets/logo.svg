<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="90" fill="url(#g)" opacity="0.15"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- 集字，用JP双字母风格 -->
  <text x="100" y="125" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#g)" text-anchor="middle">集</text>
  <!-- 装饰小点 -->
  <circle cx="82" cy="65" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="118" cy="65" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="65" cy="148" r="3" fill="#6366f1" opacity="0.4"/>
  <circle cx="135" cy="148" r="3" fill="#06b6d4" opacity="0.4"/>
</svg>
